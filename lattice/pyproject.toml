[project]
name = "lattice"
version = "0.1.1"
description = "A compositional, self-improving reasoning substrate for small coding LLMs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
authors = [
    {name = "avisual"},
]
keywords = [
    "AI",
    "LLM",
    "coding-agent",
    "hebbian",
    "small-models",
    "structured-reasoning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.9",
    "libcst>=1.5",
    "numpy>=2.0",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
]
llm = [
    "torch>=2.5",
    "transformers>=4.46",
    "accelerate>=1.0",
    "sentence-transformers>=3.2",
]
hosted = [
    "anthropic>=0.40",
]
typecheck = [
    "mypy>=1.13",
]
search = [
    "semble>=0.2",
]

[project.scripts]
lattice = "lattice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
